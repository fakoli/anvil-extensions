name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (workspaces, lockfile-pinned)
        run: npm ci --no-audit --no-fund

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Offline test suites
        run: |
          set -e
          # Single source of truth with scripts/release-verify.sh
          while IFS= read -r ws; do
            [ -z "$ws" ] && continue
            echo "::group::tests: $ws"
            npm test --workspace "$ws"
            echo "::endgroup::"
          done < <(sed 's/#.*//' scripts/test-matrix.txt)