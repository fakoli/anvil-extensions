name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (workspaces, lockfile-pinned)
        run: npm ci --no-audit --no-fund

      - name: Install pi bundle for test-time module aliases
        run: |
          mkdir -p "$HOME/pi-bundle"
          cd "$HOME/pi-bundle"
          npm init -y >/dev/null
          npm install @earendil-works/pi-coding-agent@0.85.1 --no-audit --no-fund
          echo "PI_INSTALL_DIR=$HOME/pi-bundle/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"

      - name: Offline test suites
        run: |
          set -e
          for ws in pi-commentary pi-condense pi-hermes-memory pi-insights \
                    pi-nano-banana pi-permission-system pi-sandbox-config \
                    pi-subagents pi-tool-repair pi-voice-clone; do
            echo "::group::tests: $ws"
            npm test --workspace "$ws"
            echo "::endgroup::"
          done